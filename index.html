<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="styleRPSgame.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <div class="game">
        <div class="choice" id="rock">
            <i class="fa-solid fa-hand-back-fist" id="rock-icon"></i>
        </div>
        <div class="choice" id="paper">
            <i class="fa-solid fa-hand" id="paper-icon"></i>
        </div>
        <div class="choice" id="scissors">
            <i class="fa-solid fa-hand-scissors" id="scissors-icon"></i>
        </div>
    </div>
   
    <div class="score-board">
        <div class="score">
            <p id="your-score">0</p>
            <p>Your Score</p>
        </div>
        <div class="score">
            <p id="computer-score">0</p>
            <p>Computer Score</p>
        </div>
    </div>
    <div class="msg-container">
        <p id="message">Choose your move!</p>
    </div>
    <button class="reset-button">Reset Game</button>
    <script src="appRPSgame.js"></script>
</body>
</html>
